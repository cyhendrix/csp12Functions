<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 12 • Creating Functions Practice Lab</title><style>
:root{--p:#48216e;--gold:#f4c42e;--bg:#f4effa;--pale:#efe3fa;--cream:#fffaf0}
*{box-sizing:border-box}body{font:16px/1.5 Arial,sans-serif;margin:0;background:var(--bg);color:#1d1630}header{background:var(--p);color:#fff;padding:14px 20px 24px}header .inner{max-width:1000px;margin:auto}header h1{font-size:32px;margin:2px 0}main{max-width:1000px;margin:18px auto;padding:0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}.tab{padding:12px 16px;border:2px solid var(--p);border-radius:10px;background:white;color:var(--p);font-weight:700;cursor:pointer}.tab.active{background:var(--p);color:white}
.status{background:#eadcf5;color:var(--p);padding:9px 12px;border-radius:9px;font-weight:bold;margin-bottom:16px}
.panel{background:white;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 2px 10px #26113412}.panel h2{color:var(--p);margin:0 0 12px}.student{border:3px solid var(--gold);background:var(--cream);padding:0;overflow:hidden}.student h2{background:var(--p);color:white;padding:16px 22px;margin:0}.student .inside{padding:18px 22px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.fields label{font-weight:bold}
input,select{padding:11px;border:2px solid var(--p);border-radius:8px;font:inherit;max-width:100%}.fields input,.fields select{width:100%;display:block;margin-top:8px}
button.action{background:var(--p);color:white;border:2px solid var(--gold);padding:11px 17px;border-radius:9px;font-weight:bold;cursor:pointer;margin:12px 8px 0 0}button.action:disabled{opacity:.45;cursor:default}
.lesson-select{width:100%;max-width:430px;margin:8px 0 20px}.question{border:1px solid #dcd0e9;border-radius:12px;padding:16px;margin:14px 0}.question strong{display:block;margin-bottom:10px}.wordbank{background:#f1e9fa;padding:12px;border-radius:10px;margin:12px 0}.question select{width:100%;margin:6px 0}.feedback{font-weight:bold;margin:10px 0}.correct{color:#166d38}.wrong{color:#a5243a}.choices label{display:block;padding:10px;background:#f7f3fa;border-radius:8px;margin:7px 0;cursor:pointer}.choices input{margin-right:10px}
pre{background:#332048;color:white;padding:18px;white-space:pre-wrap;overflow:auto;border-left:5px solid var(--gold);border-radius:8px;font:16px/1.6 Consolas,monospace}
.bank{background:#f1e9fa;padding:10px;border-radius:10px;min-height:55px}.tile{display:inline-block;white-space:pre-wrap;font:15px Consolas,monospace;background:var(--p);color:white;border:2px solid var(--gold);border-radius:8px;padding:10px;margin:4px;cursor:grab;user-select:none}.tile.selected{outline:3px solid #e2a400}
.slot{border:2px dashed #a18ab6;border-radius:8px;min-height:51px;margin:8px 0;padding:4px;cursor:pointer}.slot .tile{margin:0}.small{font-size:14px;color:#574b65}.hidden{display:none}.stat{display:inline-block;background:var(--pale);padding:15px;border-radius:10px;margin:7px 10px 7px 0}.danger{background:white!important;color:#922b43!important;border-color:#b97a87!important}
@media(max-width:650px){.fields{grid-template-columns:1fr}header h1{font-size:25px}.panel{padding:16px}.student{padding:0}}
.code-input{width:100%;margin:8px 0;font-family:Consolas,monospace}.code-entry{width:100%;min-height:180px;padding:16px;border:2px solid var(--p);border-radius:10px;font:16px/1.6 Consolas,monospace;tab-size:4;resize:vertical}.code-entry:disabled,.code-input:disabled{background:#f0edf3}.question-check{display:block;margin:12px 0 6px!important;padding:8px 14px!important}.question-check:disabled{opacity:.55;cursor:not-allowed}.feedback:empty{display:none}</style></head><body><header><div class="inner"><div>COMPUTER SCIENCE PRINCIPLES • CHAPTER 12</div><h1>Creating Functions</h1><div>Practice Lab • Four lessons with mixed activities</div></div></header><main><nav class="tabs" id="tabs"></nav><div class="status" id="status"></div><section id="content"></section></main><script>
const DATA={"lessons":[{"title":"Writing and Calling Functions","intro":"A function is reusable code. Define it with def, then call it by name. Python skips its body until called.","code":"def say_hi():\n    print(\"Hello!\")\n    return\n\nsay_hi()","questions":[["Which keyword defines a function?",["def","return","global"],0],["When does the body run?",["When called","When defined","When saved"],0],["What is a function call?",["say_hi()","def say_hi():","return"],0]],"task":"Arrange the lines of a function","lines":["def say_hi():","    print(\"Hello!\")","    return","say_hi()"]},{"title":"Function Inputs and Outputs","intro":"Parameters receive input. Arguments supply values. A return statement sends a result back. Default parameters provide fallback values.","code":"def double(number):\n    return number * 2\n\nprint(double(4))","questions":[["What is number in the definition?",["parameter","global","module"],0],["What does double(4) return?",["8","4","2"],0],["What keyword sends back a result?",["return","def","import"],0]],"task":"Arrange a function with a return value","lines":["def double(number):","    return number * 2","print(double(4))"]},{"title":"Local and Global Scope","intro":"Scope determines where a variable can be used. A local variable is created inside a function; a global variable is created outside. Prefer parameters and return values.","code":"def favorite():\n    music = \"Jazz\"\n    return music\n\nprint(favorite())","questions":[["Where is a local variable created?",["Inside a function","Outside all functions","Inside a comment"],0],["What is scope?",["Where a variable is visible","A list index","A string slice"],0],["What is best practice?",["Pass values as parameters","Change every global","Avoid functions"],0]],"task":"Arrange a local variable example","lines":["def favorite():","    music = \"Jazz\"","    return music","print(favorite())"]},{"title":"Procedural Abstraction","intro":"Abstraction means using a function without needing its internal details. Modularity means organizing reusable parts. Decomposition breaks large problems into smaller steps.","code":"def greet(name):\n    return \"Hi \" + name\n\nprint(greet(\"Sam\"))","questions":[["Breaking a problem into steps is…",["decomposition","concatenation","scope"],0],["Reusable separate program parts show…",["modularity","indexing","casting"],0],["Using a function without its details is…",["abstraction","iteration","assignment"],0]],"task":"Arrange a reusable greeting function","lines":["def greet(name):","    return \"Hi \" + name","print(greet(\"Sam\"))"]}],"vocab":[[["function","Reusable block of code"],["def","Keyword used to define a function"],["call","Runs a function"],["return","Sends a value back"]],[["parameter","Variable listed in a function definition"],["argument","Value passed when calling a function"],["default","Fallback value for an omitted argument"],["keyword argument","Argument identified by its parameter name"]],[["local","Variable defined inside a function"],["global","Variable defined outside functions"],["scope","Where a variable can be accessed"],["global keyword","Declares use of a global variable for assignment"]],[["abstraction","Hide details behind a simple interface"],["decomposition","Break a large problem into smaller parts"],["modularity","Organize a program into reusable pieces"],["API","Documented way to use code or services"]]],"blanks":[[{"prompt":"Complete the function definition","code":"___ say_hi():\n    print('Hello!')","answer":"def","options":["return","def","print"]},{"prompt":"Complete the function call","code":"def say_hi():\n    print('Hello!')\n\n___","answer":"say_hi()","options":["def say_hi():","say_hi()","return"]}],[{"prompt":"Complete the return statement","code":"def double(number):\n    ___ number * 2","answer":"return","options":["print","return","global"]},{"prompt":"Complete the function call — enter 4 as input; the function prints 8","code":"def double(number):\n    return number * 2\n\nprint(double(___))","answer":"4","options":["number","def","4"]}],[{"prompt":"Create a local variable","code":"def favorite():\n    ___ = 'Jazz'\n    return music","answer":"music","options":["global","music","return"]},{"prompt":"Return the local value","code":"def favorite():\n    music = 'Jazz'\n    ___ music","answer":"return","options":["def","return","print"]}],[{"prompt":"Complete the parameter","code":"def greet(___):\n    return 'Hi ' + name","answer":"name","options":["return","name","print"]},{"prompt":"Call the reusable function","code":"def greet(name):\n    return 'Hi ' + name\n\nprint(___)","answer":"greet('Sam')","options":["def greet","return","greet('Sam')"]}]]};const KEY="csp12Functions_activity_tabs_v2";let state={first:"",last:"",period:"",tab:"Student Info",lesson:0,answers:{},orders:{},positions:{},completed:{},attempts:{},submitted:false};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const tabs=["Student Info","Lesson 1","Lesson 2","Lesson 3","Lesson 4","Results"];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const id=(t,i,j)=>t+"-"+i+"-"+j;
const tries=k=>state.attempts[k]||0;const locked=k=>!!state.completed[k]||tries(k)>=2;const allCount=()=>{let count=0;for(let i=0;i<4;i++){for(let j=0;j<4;j++)if(locked(id("v",i,j)))count++;for(let j=0;j<2;j++)if(locked(id("f",i,j)))count++;if(locked(id("o",i,0)))count++;for(let j=0;j<3;j++)if(locked(id("q",i,j)))count++}return count};
const correctCount=()=>Object.values(state.completed).filter(Boolean).length;const feedback=k=>state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":tries(k)>0?"Not quite. You have one more try.":"";function selectTab(t){if(t!=="Student Info"&&(!state.first||!state.last||!state.period)){alert("Enter your student information first.");return}state.tab=t;if(/^Lesson [1-4]$/.test(t))state.lesson=Number(t.slice(-1))-1;save();render()}
function setLesson(i){state.lesson=Number(i);save();render()}
function render(){if(!tabs.includes(state.tab))state.tab=(state.first&&state.last&&state.period)?"Lesson 1":"Student Info";if(/^Lesson [1-4]$/.test(state.tab))state.lesson=Number(state.tab.slice(-1))-1;document.getElementById("tabs").style.display=state.tab==="Student Info"?"none":"flex";document.getElementById("status").style.display=state.tab==="Student Info"?"none":"block";document.getElementById("tabs").innerHTML=tabs.filter(t=>t!=="Student Info").map(t=>'<button class="tab '+(t===state.tab?"active":"")+'" onclick="selectTab('+JSON.stringify(t).replace(/"/g,"&quot;")+')">'+t+'</button>').join("");document.getElementById("status").textContent="Practice questions: 40 • Finished: "+allCount()+"/40 • Correct: "+correctCount()+"/40 • Maximum 2 checks per question.";let h="";
if(state.tab==="Student Info"){h='<section class="panel student"><h2>✦ Student Information</h2><div class="inside"><p>Enter your first name, last name, and class period. Then click <b>Begin Practice Lab</b>.</p><div class="fields"><label>First Name<input id="first" placeholder="First Name" value="'+esc(state.first)+'"></label><label>Last Name<input id="last" placeholder="Last Name" value="'+esc(state.last)+'"></label><label>Class Period<select id="period"><option value="">Choose a class period</option>'+["1st Block","2nd Block","3rd Block","4th Block"].map(p=>'<option '+(p===state.period?"selected":"")+'>'+p+'</option>').join("")+'</select></label></div><button class="action" onclick="begin()">Begin Practice Lab</button><p class="small">Your answers are saved on this device.</p></div></section>'}
else if(state.tab==="Results"){let n=allCount(),score=correctCount();h='<section class="panel"><h2>Results</h2><div class="stat"><b>'+n+' / 40</b><br>Checks completed</div><div class="stat"><b>'+Math.round(score/40*100)+'%</b><br>Score</div><p>'+(n===40?"All activities completed!":"Finish every question (correct or two checks used) to submit your grade.")+'</p><button class="action" '+(n!==40||state.submitted?"disabled":"")+' onclick="submitGrade()">Submit Grade</button><button class="action danger" onclick="resetLab()">Clear Saved Information</button><p id="message" class="small">'+(state.submitted?"Grade submission was sent. Confirm it in your teacher's spreadsheet.":"")+'</p></section>'}
else{let i=state.lesson;h='<section class="panel"><h2>Lesson '+(i+1)+': '+esc(DATA.lessons[i].title)+'</h2><p>'+esc(DATA.lessons[i].intro)+'</p><p class="small"><b>Instructions:</b> Each question has a maximum of 2 checks. Correct answers lock immediately. After a second incorrect check, the answer locks and you can continue. Use the Check Answer button beneath each question.</p></section>';
{let words=DATA.vocab[i];let key="bank-v-"+i;if(!state.orders[key])state.orders[key]=shuffle(words.map(x=>x[0]));h+='<section class="panel"><h2>Match the Definitions</h2><p>Choose a vocabulary word for each definition.</p><div class="wordbank"><b>Word Bank:</b> '+state.orders[key].map(esc).join(" • ")+'</div>';words.forEach((pair,j)=>{let k=id("v",i,j),chosen=state.answers[k]||"";h+='<div class="question"><strong>'+(j+1)+'. '+esc(pair[1])+'</strong><select id="'+k+'" '+(locked(k)?"disabled":"")+'><option value="">Select a term</option>'+state.orders[key].map(w=>'<option '+(w===chosen?"selected":"")+' value="'+esc(w)+'">'+esc(w)+'</option>').join("")+'</select><button class="action question-check" '+(locked(k)?'disabled':'')+' onclick="checkVocabulary('+j+')">Check Answer</button><div class="feedback '+(state.completed[k]?"correct":locked(k)?"wrong":"")+'" id="fb-'+k+'">'+feedback(k)+'</div></div>'});h+='</section>'}
{h+='<section class="panel"><h2>Type the Missing Code</h2><p>Type the Python code that belongs in each blank. No answer choices.</p>';DATA.blanks[i].forEach((q,j)=>{let k=id("f",i,j),ok=locked(k);h+='<div class="question"><strong>'+(j+1)+'. '+esc(q.prompt)+'</strong><pre>'+esc(q.code)+'</pre><label for="'+k+'"><b>Type the missing code:</b></label><input class="code-input" id="'+k+'" autocomplete="off" spellcheck="false" value="'+esc(state.answers[k]||"")+'" '+(ok?"disabled":"")+' oninput="rememberCode(this)"><button class="action question-check" '+(locked(k)?'disabled':'')+' onclick="checkFill('+j+')">Check Answer</button><div class="feedback '+(state.completed[k]?"correct":locked(k)?"wrong":"")+'" id="fb-'+k+'">'+feedback(k)+'</div></div>'});h+='</section>'}
{h+='<section class="panel"><h2>Check Your Understanding</h2><p>Study this Python example, then answer the questions.</p><pre>'+esc(DATA.lessons[i].code)+'</pre>';DATA.lessons[i].questions.forEach((q,j)=>{let k=id("q",i,j),ok=locked(k);if(!state.orders[k])state.orders[k]=shuffle([0,1,2]);h+='<div class="question"><strong>'+(j+1)+'. '+esc(q[0])+'</strong><div class="choices">'+state.orders[k].map(x=>'<label><input type="radio" name="'+k+'" value="'+x+'" '+(state.answers[k]===x?"checked":"")+' '+(ok?"disabled":"")+'>'+esc(q[1][x])+'</label>').join("")+'</div><button class="action question-check" '+(locked(k)?'disabled':'')+' onclick="checkQuick('+j+')">Check Answer</button><div class="feedback '+(state.completed[k]?"correct":locked(k)?"wrong":"")+'" id="fb-'+k+'">'+(feedback(k))+'</div></div>'});h+='</section>'}
{let k=id("o",i,0);h+='<section class="panel"><h2>Write the Code in Order</h2><p>'+esc(DATA.lessons[i].task)+'. Type the full Python code in the correct order, including indentation.</p><label for="ordercode"><b>Type the complete code:</b></label><textarea id="ordercode" class="code-entry" spellcheck="false" '+(locked(k)?"disabled":"")+' oninput="rememberOrder(this)">'+esc(state.answers[k]||"")+'</textarea><button class="action" onclick="checkOrder()">Check Typed Code</button><div id="orderfb" class="feedback">'+feedback(k)+'</div></section>'}
h+='<div class="panel"><button class="action" onclick="nextActivity()">Next Lesson →</button><button class="action danger" onclick="resetLab()">Clear Saved Information</button></div>'}
document.getElementById("content").innerHTML=h;save()}
function begin(){let a=document.getElementById("first").value.trim(),b=document.getElementById("last").value.trim(),p=document.getElementById("period").value;if(!a||!b||!p){alert("Please enter your first name, last name, and class period.");return}state.first=a;state.last=b;state.period=p;selectTab("Lesson 1")}
function updateChecks(prefix,items,getCorrect,questionIndex){let i=state.lesson;items.forEach((item,j)=>{if(j!==questionIndex)return;let k=id(prefix,i,j);if(locked(k))return;let el=document.getElementById(k),v=el.value;if(!v)return;state.answers[k]=v;state.attempts[k]=tries(k)+1;state.completed[k]=v===String(getCorrect(item));if(locked(k)){el.disabled=true;let btn=el.closest(".question").querySelector(".question-check");if(btn)btn.disabled=true}let fb=document.getElementById("fb-"+k);fb.textContent=state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Try again.";fb.className="feedback "+(state.completed[k]?"correct":"wrong")});save();refreshStatus()}
function checkVocabulary(j){updateChecks("v",DATA.vocab[state.lesson],x=>x[0],j)}
function rememberCode(el){state.answers[el.id]=el.value;save()}
function rememberOrder(el){state.answers[id("o",state.lesson,0)]=el.value;save()}
function normalizeCode(v){return String(v).replace(/\r\n?/g,"\n").split("\n").map(x=>x.replace(/\s+$/,"")).filter(x=>x.trim()!=="").join("\n")}
function checkFill(questionIndex){let i=state.lesson;DATA.blanks[i].forEach((q,j)=>{if(j!==questionIndex)return;let k=id("f",i,j);if(locked(k))return;let el=document.getElementById(k),v=el.value.trim();if(!v)return;state.answers[k]=el.value;state.attempts[k]=tries(k)+1;state.completed[k]=v===q.answer;if(locked(k))el.disabled=true;let fb=document.getElementById("fb-"+k);fb.textContent=state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Try again.";fb.className="feedback "+(state.completed[k]?"correct":"wrong")});save();refreshStatus()}
function checkQuick(questionIndex){let i=state.lesson;DATA.lessons[i].questions.forEach((q,j)=>{if(j!==questionIndex)return;let k=id("q",i,j);if(locked(k))return;let picked=document.querySelector('input[name="'+k+'"]:checked');if(!picked)return;let v=Number(picked.value);state.answers[k]=v;state.attempts[k]=tries(k)+1;state.completed[k]=v===q[2];if(locked(k)){document.querySelectorAll('input[name="'+k+'"]').forEach(el=>el.disabled=true);let btn=document.querySelector('input[name="'+k+'"]').closest(".question").querySelector(".question-check");if(btn)btn.disabled=true}let fb=document.getElementById("fb-"+k);fb.textContent=state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Try again.";fb.className="feedback "+(state.completed[k]?"correct":"wrong")});save();refreshStatus()}
function refreshStatus(){document.getElementById("status").textContent="Practice questions: 40 • Finished: "+allCount()+"/40 • Correct: "+correctCount()+"/40 • Maximum 2 checks per question."}
function checkOrder(){let i=state.lesson,k=id("o",i,0);if(locked(k))return;let el=document.getElementById("ordercode"),v=el.value;if(!v.trim())return;state.answers[k]=v;state.attempts[k]=tries(k)+1;let expected=DATA.lessons[i].lines.join("\n");let ok=normalizeCode(v)===normalizeCode(expected);state.completed[k]=ok;save();let fb=document.getElementById("orderfb");fb.className="feedback "+(ok?"correct":"wrong");fb.textContent=ok?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Check order and indentation, then try again.";if(locked(k))el.disabled=true;refreshStatus()}
function nextActivity(){let ix=tabs.indexOf(state.tab);selectTab(tabs[Math.min(ix+1,tabs.length-1)]);window.scrollTo({top:0,behavior:"instant"})}
function resetLab(){if(confirm("Clear all saved answers and student information?")){localStorage.removeItem(KEY);location.reload()}}
function submitGrade(){if(state.submitted||allCount()!==40)return;let frame=document.createElement("iframe");frame.name="gradeFrame";frame.style.display="none";document.body.appendChild(frame);let form=document.createElement("form");form.method="POST";form.action="https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse";form.target="gradeFrame";let data={"entry.2089413779":state.last+", "+state.first,"entry.890934651":state.period,"entry.646173439":"Chapter 12 Creating Functions","entry.962158861":correctCount()+"/40 ("+Math.round(correctCount()/40*100)+"%)"};Object.entries(data).forEach(([k,v])=>{let x=document.createElement("input");x.name=k;x.value=v;form.appendChild(x)});document.body.appendChild(form);form.submit();form.remove();state.submitted=true;save();render()}
render();
</script></body></html>
