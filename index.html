<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 12 • Functions Practice Lab</title><style>:root{--p:#682aa2;--d:#2b1746}*{box-sizing:border-box}body{margin:0;background:#f1edf6;font:17px Arial;color:#241e30}header{background:var(--d);color:white;padding:20px}main{max-width:900px;margin:20px auto;padding:0 15px}.card{background:white;border-radius:14px;padding:25px;margin:15px 0;box-shadow:0 2px 10px #0001}h1,h2{margin:0 0 16px}h2{color:var(--p)}pre{background:#242033;color:white;padding:18px;white-space:pre-wrap;border-radius:8px;font-size:16px}.tile,button{background:var(--p);color:white;border:0;border-radius:8px;padding:12px 15px;cursor:pointer;font-weight:bold}.tile{display:inline-block;margin:5px;touch-action:none;cursor:grab}.tile.selected{outline:3px solid #e9b62c}.slot{min-height:51px;border:2px dashed #a589c3;margin:9px 0;padding:5px;border-radius:8px}.slot .tile{margin:0}label{display:block;margin:8px 0}.choice{padding:11px;background:#f6f0fb;border-radius:8px;display:block;margin:8px 0}input,select{padding:10px;border:1px solid #a18db4;border-radius:6px;font-size:16px}input[type=radio]{margin-right:10px}button{margin:8px 8px 8px 0}button:disabled{opacity:.4}.note{color:#625371}.ok{color:#16753b}.error{color:#b12743}.hidden{display:none}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.bank{padding:10px;background:#f0e8f9;min-height:50px;border-radius:8px}@media(max-width:600px){.card{padding:16px}}</style></head><body><header><h1>Chapter 12 • Creating Functions</h1><div>CompuScholar CSP • Independent Practice Lab</div></header><main><section class="card" id="identity"><h2>Student Information</h2><label>Student Name (Last, First) <input id="name" placeholder="Last, First" autocomplete="name"></label><label>Class Period <select id="period"><option value="">Choose block</option><option>1st Block</option><option>2nd Block</option><option>3rd Block</option><option>4th Block</option></select></label><button id="start">Start / Continue</button><p class="note">Your work saves automatically on this device.</p></section><section id="work" class="hidden"><div class="card bar"><strong id="progress"></strong><select id="lesson"></select><button id="clear">Start New Attempt</button></div><div id="body"></div><div class="card"><button id="prev">← Previous Lesson</button><button id="next">Next Lesson →</button></div><section class="card" id="finish"><h2>Final Results</h2><div id="score"></div><button id="submit">Submit Grade</button><p id="submitmsg"></p></section></section></main><script>const LESSONS=[{"title":"Writing and Calling Functions","intro":"A function is reusable code. Define it with def, then call it by name. Python skips its body until called.","code":"def say_hi():\n    print(\"Hello!\")\n    return\n\nsay_hi()","questions":[["Which keyword defines a function?",["def","return","global"],0],["When does the body run?",["When called","When defined","When saved"],0],["What is a function call?",["say_hi()","def say_hi():","return"],0]],"task":"Arrange the lines of a function","lines":["def say_hi():","    print(\"Hello!\")","    return","say_hi()"]},{"title":"Function Inputs and Outputs","intro":"Parameters receive input. Arguments supply values. A return statement sends a result back. Default parameters provide fallback values.","code":"def double(number):\n    return number * 2\n\nprint(double(4))","questions":[["What is number in the definition?",["parameter","global","module"],0],["What does double(4) return?",["8","4","2"],0],["What keyword sends back a result?",["return","def","import"],0]],"task":"Arrange a function with a return value","lines":["def double(number):","    return number * 2","print(double(4))"]},{"title":"Local and Global Scope","intro":"Scope determines where a variable can be used. A local variable is created inside a function; a global variable is created outside. Prefer parameters and return values.","code":"def favorite():\n    music = \"Jazz\"\n    return music\n\nprint(favorite())","questions":[["Where is a local variable created?",["Inside a function","Outside all functions","Inside a comment"],0],["What is scope?",["Where a variable is visible","A list index","A string slice"],0],["What is best practice?",["Pass values as parameters","Change every global","Avoid functions"],0]],"task":"Arrange a local variable example","lines":["def favorite():","    music = \"Jazz\"","    return music","print(favorite())"]},{"title":"Procedural Abstraction","intro":"Abstraction means using a function without needing its internal details. Modularity means organizing reusable parts. Decomposition breaks large problems into smaller steps.","code":"def greet(name):\n    return \"Hi \" + name\n\nprint(greet(\"Sam\"))","questions":[["Breaking a problem into steps is…",["decomposition","concatenation","scope"],0],["Reusable separate program parts show…",["modularity","indexing","casting"],0],["Using a function without its details is…",["abstraction","iteration","assignment"],0]],"task":"Arrange a reusable greeting function","lines":["def greet(name):","    return \"Hi \" + name","print(greet(\"Sam\"))"]}];const KEY="csp12Functions_lab_v1";let state={name:"",period:"",lesson:0,answers:{},orders:{},coding:{},submitted:false};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){};const $=x=>document.getElementById(x);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function initialize(){ $("name").value=state.name;$("period").value=state.period;$("lesson").innerHTML=LESSONS.map((l,i)=>'<option value="'+i+'">Lesson '+(i+1)+': '+l.title+'</option>').join("");if(state.name&&state.period)show()}function show(){ $("work").classList.remove("hidden");$("identity").classList.add("hidden");$("lesson").value=state.lesson;render()}function render(){const i=state.lesson,l=LESSONS[i];let h='<div class="card"><h2>Lesson '+(i+1)+': '+l.title+'</h2><p>'+l.intro+'</p><h3>Study this code</h3><pre>'+esc(l.code)+'</pre></div><div class="card"><h2>Quick Checks</h2><p class="note">Choose an answer. Incorrect answers can be retried.</p>';l.questions.forEach((q,j)=>{let id=i+"-"+j;if(!state.orders[id]){state.orders[id]=shuffle([0,1,2]);save()}h+='<div><strong>'+(j+1)+'. '+q[0]+'</strong>';state.orders[id].forEach(k=>{h+='<label class="choice"><input type="radio" name="q'+id+'" value="'+k+'" '+(state.answers[id]===k?'checked':'')+' onchange="answer(\''+id+'\','+k+')">'+esc(q[1][k])+'</label>'});h+='<div id="fb'+id+'" class="'+(state.answers[id]===q[2]?'ok':'error')+'">'+(state.answers[id]===q[2]?'✓ Correct':'')+'</div></div>'});h+='</div><div class="card"><h2>Coding Check • Put the lines in order</h2><p>'+l.task+'. Drag purple tiles into the numbered boxes, or tap a tile then tap a box.</p><div class="bank" id="bank"></div><div id="slots"></div><button onclick="checkCode()">Check Code</button><div id="codefb"></div></div>'; $("body").innerHTML=h;renderCode();let n=0;LESSONS.forEach((x,a)=>x.questions.forEach((q,b)=>{if(state.answers[a+"-"+b]===q[2])n++}));let c=Object.values(state.coding).filter(Boolean).length;$("progress").textContent=(n+c)+" / 16 checks completed";$("score").innerHTML='<p><strong>Questions correct:</strong> '+n+'/12</p><p><strong>Coding checks:</strong> '+c+'/4</p><p><strong>Score:</strong> '+(n+c)+'/16 ('+Math.round((n+c)/16*100)+'%)</p><p>'+(n+c===16?'All checks complete!':'Complete all checks before submitting.')+'</p>';$("submit").disabled=n+c!==16||state.submitted;$("prev").disabled=i===0;$("next").disabled=i===3;save()}function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function answer(id,k){let [i,j]=id.split("-").map(Number),q=LESSONS[i].questions[j];if(state.answers[id]===q[2])return;if(k===q[2])state.answers[id]=k;else delete state.answers[id];render();if(k!==q[2])$("fb"+id).textContent="Not quite — review the explanation and try again."}let selected=null;function renderCode(){let i=state.lesson,l=LESSONS[i];if(!state.orders["code"+i])state.orders["code"+i]=shuffle(l.lines.map((_,k)=>k));let placement=state.orders["place"+i]||[];const bank=$("bank"),slots=$("slots");bank.innerHTML="";slots.innerHTML="";state.orders["code"+i].forEach(k=>{if(!placement.includes(k))bank.appendChild(tile(k,l.lines[k]))});l.lines.forEach((_,j)=>{let div=document.createElement("div");div.className="slot";div.dataset.pos=j;div.textContent=(j+1)+". ";if(placement[j]!==undefined)div.appendChild(tile(placement[j],l.lines[placement[j]]));div.ondragover=e=>e.preventDefault();div.ondrop=e=>{e.preventDefault();place(Number(e.dataTransfer.getData("text/plain")),j)};div.onclick=()=>{if(selected!==null)place(selected,j)};slots.appendChild(div)});if(state.coding[i])$("codefb").innerHTML='<span class="ok">✓ Coding check complete</span>'}function tile(k,t){let el=document.createElement("span");el.className="tile";el.textContent=t;el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData("text/plain",String(k));el.onclick=e=>{e.stopPropagation();selected=k;document.querySelectorAll(".tile").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")};return el}function place(k,j){let i=state.lesson,arr=[...(state.orders["place"+i]||[])];arr=arr.map(x=>x===k?undefined:x);if(arr[j]!==undefined){let old=arr[j];arr[j]=undefined}arr[j]=k;state.orders["place"+i]=arr;state.coding[i]=false;selected=null;save();renderCode()}function checkCode(){let i=state.lesson,arr=state.orders["place"+i]||[],good=LESSONS[i].lines.every((_,j)=>arr[j]===j);state.coding[i]=good;$("codefb").className=good?"ok":"error";$("codefb").textContent=good?"✓ Correct order!":"Not yet. Check indentation and which line runs first, then try again.";save();if(good)render()}$("start").onclick=()=>{let n=$("name").value.trim(),p=$("period").value;if(!n||!p){alert("Enter your name and class period first.");return}state.name=n;state.period=p;save();show()};$("lesson").onchange=e=>{state.lesson=Number(e.target.value);render()};$("prev").onclick=()=>{state.lesson--;render()};$("next").onclick=()=>{state.lesson++;render()};$("clear").onclick=()=>{if(confirm("Clear ALL saved answers and start a new attempt?")){localStorage.removeItem(KEY);location.reload()}};$("submit").onclick=()=>{if(state.submitted)return;let n=0;LESSONS.forEach((l,i)=>l.questions.forEach((q,j)=>{if(state.answers[i+"-"+j]===q[2])n++}));let pts=n+Object.values(state.coding).filter(Boolean).length;if(pts!==16)return;let form=document.createElement("form");form.method="POST";form.action="https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse";form.target="gradeFrame";const fields={"entry.2089413779":state.name,"entry.890934651":state.period,"entry.646173439":"Chapter 12 Creating Functions","entry.962158861":pts+"/16 ("+Math.round(pts/16*100)+"%)"};Object.entries(fields).forEach(([k,v])=>{let el=document.createElement("input");el.name=k;el.value=v;form.appendChild(el)});let iframe=document.createElement("iframe");iframe.name="gradeFrame";iframe.style.display="none";document.body.appendChild(iframe);document.body.appendChild(form);form.submit();state.submitted=true;save();$("submitmsg").textContent="Grade submission sent. Please confirm it appears in the response spreadsheet.";render()};initialize();</script></body></html>
